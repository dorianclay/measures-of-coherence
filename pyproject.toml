[project]
name = "measures-of-coherence"
version = "0.1.0"
description = "Studying how to measure the coherence of agentic systems."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.0.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbformat>=5.11.1",
    "numpy>=1.26.0,<2.0.0",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.14.0",
    "torch>=2.13.0",
    "tqdm>=4.69.0",
    "transformers>=5.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coherence", "src/probing", "src/analysis"]

# On Linux (the cluster), pull CUDA-enabled torch wheels from the cu130 index;
# macOS keeps the default PyPI build (MPS). The L40s (sm_89) are supported by
# CUDA 13; if the cluster's driver is older than R580, drop to an older index.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
